# Chrome profiles: Default = personal, Profile 2 = pythian, Profile 3 = lanvera

workspace = 1, monitor:DP-5, default:true
workspace = 2, monitor:DP-5
workspace = 3, monitor:DP-5
workspace = 4, monitor:DP-5
workspace = 5, monitor:DP-6, default:true
workspace = 6, monitor:DP-6
workspace = 7, monitor:DP-6
workspace = 8, monitor:DP-6
workspace = 0, monitor:eDP-1, default:true

# Application keybindings (overrides omarchy defaults)
unbind = SUPER SHIFT, SLASH
unbind = SUPER SHIFT, A
unbind = SUPER SHIFT ALT, A
unbind = SUPER SHIFT, B
unbind = SUPER SHIFT, C
unbind = SUPER SHIFT, E
unbind = SUPER SHIFT, G
unbind = SUPER SHIFT, M
unbind = SUPER SHIFT, N
unbind = SUPER SHIFT, S
unbind = SUPER SHIFT, W
unbind = SUPER SHIFT, Y

bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser --profile-directory="Default"
bindd = SUPER, E, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, E, Email, exec, uwsm app -- thunderbird
bindd = SUPER SHIFT, BACKSLASH, Passwords, exec, uwsm app -- 1password --quick-access
bindd = SUPER, BACKSLASH, 1Password, exec, uwsm app -- 1password
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/" --profile-directory="Default"
bindd = SUPER SHIFT, R, Pythian Notebook, exec, uwsm app -- remmina -c "/home/daniel/.local/share/remmina/group_rdp_pythian_172-16-0-16.remmina"
bindd = SUPER SHIFT, M, Meet, exec, omarchy-launch-webapp "https://meet.google.com/" --profile-directory="Profile 2"
bindd = SUPER SHIFT, T, Teams, exec, uwsm app -- teams-for-linux
bindd = SUPER SHIFT ALT, T, Teams (personal), exec, uwsm app -- teams-for-linux --class=teams-personal --user-data-dir="/home/daniel/.config/teams-personal"
bindd = SUPER SHIFT, S, Slack, exec, uwsm app -- slack --enable-features=UseOzonePlatform --ozone-platform=wayland
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/" --profile-directory="Default"
bindd = SUPER SHIFT, A, Copilot, exec, omarchy-launch-webapp "https://copilot.microsoft.com" --profile-directory="Default"
bindd = SUPER SHIFT ALT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com" --profile-directory="Default"
bindd = SUPER SHIFT, G, Gemini Enterprise, exec, omarchy-launch-webapp "https://vertexaisearch.cloud.google.com/home/cid/a72e70f2-3125-4270-916e-2c345f90d694" --profile-directory="Profile 2"
bindd = SUPER SHIFT, L, Lanvera Desktop, exec, omarchy-launch-webapp "https://windows.cloud.microsoft/webclient/avd/69350a1c-2543-4664-8ea9-d3850d5b2216/4b4019bc-77c4-408a-e788-08dbde32b101?endpointId=d136289c-954b-4134-92f0-ed117198fdbd##loginHint=TE.DU0816%40Lanvera.org" --profile-directory="Profile 3"
