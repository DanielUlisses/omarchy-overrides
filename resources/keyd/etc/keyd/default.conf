[ids]
*

[main]
# Caps: tap = Esc, hold = Super+Shift
capslock = overload(supershift, esc)
# Right Alt: PT-BR international glyph layer for en-US base layout.
rightalt = layer(ptbr_dia)

[ptbr_dia]
# Core PT-BR symbols
# Use Caps as compose trigger to match Hyprland's kb_options=compose:caps.
# (keyd remaps physical Caps for typing, but macro-emitted Caps still reaches compositor.)
c = macro(capslock c comma)
a = macro(capslock a ~)
o = macro(capslock o ~)

# Acute accents
q = macro(capslock a apostrophe)
e = macro(capslock e apostrophe)
i = macro(capslock i apostrophe)
y = macro(capslock o apostrophe)
u = macro(capslock u apostrophe)

# Other common Portuguese accents
w = macro(capslock a ^)
r = macro(capslock e ^)
t = macro(capslock o ^)
z = macro(capslock a grave)

[supershift:M-S]
