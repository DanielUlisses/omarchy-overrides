<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root">
      <div class="app">
        <div class="left">
          <button class="launcher" id="launcher" title="Command Palette (Win+Space)"><i class="nf nf-fa-windows"></i></button>
          <div id="workspaces"></div>
        </div>
        <div class="center"><span id="date"></span></div>
        <div class="right">
          <div class="claude" id="claude" title="Claude Code usage" hidden></div>
          <div id="memory"></div>
          <div id="cpu"></div>
          <div id="battery"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./bar.js"></script>
  </body>
</html>
