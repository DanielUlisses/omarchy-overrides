## Make HSP/HFP (headset mic) survivable on this machine.
##
## Hardware: Intel AX211 (8087:0033) + Soundcore headset (E8:EE:CC:4E:94:ED).
##
## Measured failure (bt-events.log, 2026-09-29 16:15-16:16, Zoom call):
## 28 profile flips and 9 transport failures in ~100 seconds, ending in a
## full BlueZ disconnect. The loop is:
##   app opens mic -> autoswitch to HFP/mSBC
##   -> kernel: "corrupted SCO packet" / "SCO packet for unknown handle 257"
##   -> spa.bluez5: Failure in Bluetooth audio transport .../fd57
##   -> nodes go running -> error, WirePlumber falls back to a2dp-sink
##   -> app still wants a mic, so it switches straight back -> repeat
## The A2DP teardown (.../sep2/fd0) errors on every flip, which is why
## playback dies as well as the mic.
##
## The SCO link itself is what breaks, so the fix targets SCO, not routing.

monitor.bluez.properties = {
  ## mSBC needs transparent-mode SCO (USB alt setting 6), which this AX211
  ## firmware handles badly -- hence "corrupted SCO packet". CVSD negotiates
  ## in standard SCO mode. Narrowband, but it stays up.
  ## A2DP codecs are untouched, so music quality is unchanged when idle.
  bluez5.codecs = [ sbc sbc_xq aac cvsd ]
  bluez5.hfphsp-backend = native
}

## Stop Bluetooth nodes being suspended mid-negotiation; the suspend/resume
## cycle turns a slow SCO setup into a failed one and feeds the flap loop.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

## Why "Default" fails in Meet/Zoom while explicitly-chosen devices work:
## a stream on the default device re-links whenever the default changes.
## Each profile flip destroys and recreates nodes, so every flip drags all
## streams with it, which both amplifies the loop and kills playback.
wireplumber.settings = {
  linking.follow-default-target = false
}
