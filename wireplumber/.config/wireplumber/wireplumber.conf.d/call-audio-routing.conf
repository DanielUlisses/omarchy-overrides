## Which mic and speaker a call gets, decided by priority instead of by hand.
##
##   mic:     USB mic (3000) > wired headset on the combo jack (2500)
##            > Bluetooth headset mic (2010, stock) > webcam mic (1500)
##            > laptop digital mic (1100)
##   speaker: Bluetooth headset (3000) > everything else (stock, <= 2000)
##
## The jack mic only counts while something is plugged in: WirePlumber skips
## nodes whose port is unavailable, so an empty jack never becomes the default.
## Wired P3 headset: jack mic and jack output, full quality.
## Bluetooth headset alone: headset is speaker and mic; recording from it flips
## it to HFP for the call (narrowband, see bluetooth-hfp-reliability.conf).
## Headset + USB mic: the USB mic records, nothing touches the headset's mic,
## so it stays in A2DP and calls keep stereo audio.
## Check what wins right now with bin/omarchy-call-audio.

wireplumber.settings = {
  ## WirePlumber remembers every source ever picked as default and ranks that
  ## history at 20000+, ignoring priority.session. The laptop mic was in the
  ## history and is always present, so it beat the headset every call and the
  ## default had to be changed by hand. With this off, a manual pick still wins
  ## until WirePlumber restarts (or `omarchy-call-audio reset`), then the
  ## priorities above decide again.
  node.restore-default-targets = false
}

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.pci-.*Mic1.*" } ]
    actions = { update-props = { priority.session = 1100 } }
  }
  {
    ## Mic2 is the combo jack (the wired P3 headset). Above the Bluetooth
    ## headset mic: if the wire is plugged in, it is the one in use.
    matches = [ { node.name = "~alsa_input.pci-.*Mic2.*" } ]
    actions = { update-props = { priority.session = 2500 } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-.*" } ]
    actions = { update-props = { priority.session = 3000 } }
  }
  {
    ## Logitech C270 webcam: USB too, but not the mic to call with.
    matches = [ { node.name = "~alsa_input.usb-046d_0825_.*" } ]
    actions = { update-props = { priority.session = 1500 } }
  }
]

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 3000 } }
  }
]
