## Use software volume for the fifine USB microphone (headphone out and mic).
## Its firmware reports a bogus 0..+16 dB range on 33 raw steps, so PipeWire's
## volume curve drives the hardware to raw 0-1 below ~50%, which is silent.
## With the soft mixer the hardware stays put and PipeWire scales the signal.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-MV-SILICON_fifine_Microphone.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
